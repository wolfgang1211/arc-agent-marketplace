  <path d="M370 420H430M700 420H760M1030 420H1090" stroke="url(#blue)" stroke-width="8" stroke-linecap="round"/>
  <rect x="90" y="705" width="980" height="70" rx="35" fill="#102318" stroke="#3FD6A8" stroke-opacity=".35"/><text x="130" y="750" fill="#3FD6A8" font-family="Inter,Arial" font-size="27" font-weight="900">MVP: gerçek para yok, Arc Testnet üzerinde test USDC kullanılıyor.</text>
